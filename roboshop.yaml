- name: create ec2-user and route53 records
  hosts: all
  connection: local
  vars:
   sg_id: sg-06d776063409f5709
   ami_id: ami-0220d79f3f480ecf5
   instances:
    - mongodb
    - catalogue
   env: dev 
   domain_name: devdaws.online
   action: create
  tasks:
   - name: create ec2 instance
     amazon.aws.ec2_instance:
      instance_type: t3.micro
      security_group: "{{ sg_id }}"
      image_id: "{{ ami_id }}"
      name: "{{ item }} - {{ env }}"
      tags:
       Project: "roboshop"
       Component: "{{ item }}"
       Environment: "{{ env }}"
       Name: "{{ item }} - {{ env }}"
     loop: "{{ instances }}"
     register: ec2_output
     when: action == "create"
   - name: print the output
     ansible.builtin.debug:
      msg: "{{ ec2_output }}"
     when: action == "create"
   - name: create r53 records
     amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "{{ item.item }} - {{ env }} - {{ domain.name }}" # mongodb-dev.daws88s.online, frontend-dev.daws88s.online
      type: A 
      ttl: 1
      value: "{{ item.instances[0].private_ip_address }}"
      wait: false
     loop: "{{ ec2_output.results }}"
   - name: create route53 records
     amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "roboshop - {{ env }}. {{ domain_name }}" # roboshop-dev.daws88s.online
      type: A 
      ttl: 1
      value: "{{ item.instances[0].public_ip_address }}"
      wait: true
     loop: "{{ ec2_output.results }}"
     when:
      - item.item == "frontend"
      - action == "create"
   - name: delete ec2_instance
     amazon.aws.ec2_instance:
      state: absent
      name: "{{ item }} - {{ env }}"
     loop: "{{ instances }}"    
     when: action == "destroy"
   - name: delete route53 records
     amazon.aws.route53:
      state: absent
      zone: "{{ domain_name }}"
      record: "{{ item }} - {{ env }}. {{ domain_name }}"
      type: A 
      ttl: 1
     loop: "{{ instances }}"
     when: action == "destroy"
     
   